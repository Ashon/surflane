name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Match this environment in the npm trusted publisher settings of both packages.
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted publishing requires npm 11.5.1 or later.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: node scripts/release.mjs verify "$GITHUB_REF_NAME"
      - run: npm run build:catalog
      - run: npm run check:package
      - run: npm run check:ssr
      - run: npm run check:public
      - run: node scripts/release.mjs publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease
