<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="A design system for platform development: shared tokens, React components and interaction patterns, refined together."
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Mobile browsers tint their toolbars with the chosen theme's --chrome, not the OS scheme. -->
    <meta
      name="theme-color"
      content="#f6f8fa"
      data-light="#f6f8fa"
      data-dark="#1b1f23"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Surflane" />
    <meta property="og:title" content="Surflane" />
    <meta
      property="og:description"
      content="A design system for platform development: shared tokens, React components and interaction patterns, refined together."
    />
    <meta property="og:url" content="https://surflane.page/" />
    <meta property="og:image" content="https://surflane.page/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Surflane, a design system for platform development"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      ;(() => {
        let mode = 'light'
        try {
          const value = document.cookie
            .split('; ')
            .find((entry) => entry.startsWith('surflane-theme='))
            ?.slice('surflane-theme='.length)
          if (['light', 'dark', 'system'].includes(value)) mode = value
        } catch {}
        document.documentElement.dataset.themeMode = mode
        const theme =
          mode === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode
        document.documentElement.dataset.theme = theme
        const chrome = document.querySelector('meta[name="theme-color"]')
        chrome.content = chrome.dataset[theme]
      })()
      ;(() => {
        let locale
        try {
          const value = document.cookie
            .split('; ')
            .find((entry) => entry.startsWith('surflane-locale='))
            ?.slice('surflane-locale='.length)
          if (value === 'en' || value === 'ko') locale = value
        } catch {}
        if (locale === undefined) {
          const first = (
            navigator.languages?.[0] ??
            navigator.language ??
            ''
          ).toLowerCase()
          locale = first.startsWith('ko') ? 'ko' : 'en'
        }
        document.documentElement.lang = locale
      })()
    </script>
    <title>Surflane</title>
  </head>
  <body class="pui-typography">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
